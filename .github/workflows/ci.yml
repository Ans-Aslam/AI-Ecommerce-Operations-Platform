name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_platform
          POSTGRES_USER: ecommerce_app
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_app -d ecommerce_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare database
        env:
          PGPASSWORD: change_me
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce_app \
            -d ecommerce_platform \
            -f database/migrations/001_initial_schema.sql
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce_app \
            -d ecommerce_platform \
            -f database/seed.sql

      - name: Run API tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ecommerce_platform
          POSTGRES_USER: ecommerce_app
          POSTGRES_PASSWORD: change_me
        run: |
          pytest tests -v
